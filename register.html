<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --white: #ffffff;
    --accent: #02100a;
    --accent-light: #e8f5e9;
    --text: #1a1a1a;
    --muted: #7a7a7a;
    --border: #e0ddd8;
    --error: #c0392b;
  }
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Nunito',sans-serif; 
    min-height: 100vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 30px 20px; 
  }
  .card { 
    background: var(--white); 
    border-radius: 20px; 
    padding: 48px; 
    width: 100%; 
    max-width: 500px; 
    box-shadow: 0 8px 40px rgba(0,0,0,0.08); 
  }
  .logo { 
    font-family: 'Playfair Display', serif; 
    font-size: 1.4rem; 
    font-weight: 700; 
    color: var(--accent); 
    margin-bottom: 24px; 
  }
  h2 { 
    font-family: 'Playfair Display', serif; 
    font-size: 1.7rem; 
    font-weight: 700; 
    margin-bottom: 6px; 
  }
  .sub { 
    color: var(--muted); 
    font-size: 0.9rem; 
    margin-bottom: 28px; 
  }
  .role-tabs { 
    display: flex; 
    gap: 8px; 
    margin-bottom: 24px; 
  }
  .role-tab { 
    flex: 1; 
    padding: 9px 0; 
    border: 1.5px solid var(--border); 
    border-radius: 8px; 
    background: transparent; 
    color: var(--muted); 
    font-family: 'Nunito', sans-serif; 
    font-size: 0.85rem; 
    font-weight: 600; 
    cursor: pointer; 
    transition: all 0.2s; 
  }
  .role-tab.active { 
    border-color: var(--accent); 
    background: var(--accent-light); 
    color: var(--accent); 
  }
  .form-group { 
    margin-bottom: 16px; 
  }
  label { 
    display: block; 
    font-size: 0.82rem; 
    font-weight: 600; 
    margin-bottom: 7px; 
  }
  input, select { 
    width: 100%; 
    border: 1.5px solid var(--border); 
    border-radius: 9px; 
    padding: 12px 14px; 
    font-family: 'Nunito', sans-serif; 
    font-size: 0.92rem; 
    color: var(--text); 
    background: #fafaf8; 
    outline: none; 
    transition: border-color 0.2s; 
  }
  input:focus, select:focus { 
    border-color: var(--accent); 
    background: #fff; 
  }
  input::placeholder { 
    color: #bbb; 
  }
  .error-msg { 
    background: #fdf0ef; 
    border: 1px solid #f5c6c2; 
    color: var(--error); 
    padding: 9px 13px; 
    border-radius: 8px; 
    font-size: 0.82rem; 
    margin-bottom: 14px; 
    display: none; 
  }
  .success-msg { 
    background: var(--accent-light); 
    border: 1px solid #a8d5b5; 
    color: var(--accent); 
    padding: 9px 13px; 
    border-radius: 8px; 
    font-size: 0.82rem; 
    margin-bottom: 14px; 
    display: none; 
  }
  .btn { 
    width: 100%; 
    padding: 13px; 
    background: var(--accent); 
    border: none; 
    border-radius: 9px; 
    color: #fff; 
    font-family: 'Nunito', sans-serif; 
    font-size: 0.95rem; 
    font-weight: 700; 
    cursor: pointer; 
    margin-top: 6px; 
  }
  .btn:hover { 
    background: #000000; 
  }
  .login-link { 
    text-align: center; 
    color: var(--muted); 
    font-size: 0.84rem; 
    margin-top: 18px; 
  }
  .login-link a { 
    color: var(--accent); 
    text-decoration: none; 
    font-weight: 600; 
  }
</style>
</head>
<body>
<div class="card">
  <h2>Create Your Account</h2>
  <div class="role-tabs">
    <button class="role-tab active" onclick="setRole('student', this)">Student</button>
    <button class="role-tab" onclick="setRole('faculty', this)">Faculty</button>
    <button class="role-tab" onclick="setRole('admin', this)">Admin</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>
  <div class="form-group">
    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
  </div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="aa@gmail.com">
  </div>
  <div class="form-group">
    <label>Phone Number</label>
    <input type="text" id="phone" placeholder="10 digit number">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Minimum 6 characters">
  </div>
  <button class="btn" onclick="handleRegister()">Create Account</button>
  <div class="login-link">Already have an account? <a href="index.html">Sign in</a></div>
</div>

<script>
  let currentRole = 'student';
  function setRole(role, el) {
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }
  async function handleRegister() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value.trim();
    const err = document.getElementById('errorMsg');
    const suc = document.getElementById('successMsg');

    err.style.display = 'none';
    suc.style.display = 'none';

    if (!name||!email||!password) {
      err.textContent = 'Name, email and password are required!';
      err.style.display = 'block';
      return;
    }
    if (password.length < 6) {
      err.textContent = 'Password must be at least 6 characters!';
      err.style.display = 'block';
      return;
    }
    try {
      const res = await fetch('http://localhost:3000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role: currentRole, phone })
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent   = data.error || 'Registration failed!';
        err.style.display = 'block';
        return;
      }
      suc.textContent   = 'Account created! Redirecting to login...';
      suc.style.display = 'block';
      setTimeout(() => window.location.href = 'index.html', 2000);
    } catch (e) {
      err.textContent   = 'Server not reachable. Is Node.js running?';
      err.style.display = 'block';
    }
  }
</script>
</body>
</html>
