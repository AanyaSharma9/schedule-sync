<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f4f0;
    --white: #ffffff;
    --accent: #060908;
    --accent-light: #e8f5e9;
    --text: #1a1a1a;
    --muted: #7a7a7a;
    --border: #e0ddd8;
    --error: #c0392b;
  }
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    max-width: 960px;
    width: 95%;
    background: var(--white);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  }
  .left {
    background: var(--accent);
    padding: 60px 50px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #fff;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
  }
  .logo span { opacity: 0.7; }
  .left-middle h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 16px;
  }
  .left-middle p {
    font-size: 0.95rem;
    line-height: 1.7;
    opacity: 0.8;
    max-width: 300px;
  }
  .left-bottom {
    display: flex;
    gap: 30px;
  }
  .stat {
    border-top: 1px solid rgba(255,255,255,0.3);
    padding-top: 14px;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
  }
  .stat-label {
    font-size: 0.75rem;
    opacity: 0.65;
    margin-top: 2px;
  }
  .right {
    padding: 55px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .right h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .right .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .role-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 26px;
  }
  .role-tab {
    flex: 1;
    padding: 9px 0;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .role-tab.active {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--accent);
  }
  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
  }
  input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 12px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.92rem;
    color: var(--text);
    background: #fafaf8;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    background: #fff;
  }
  input::placeholder {
    color: #bbb;
  }
  .error-msg {
    background: #fdf0ef;
    border: 1px solid #f5c6c2;
    color: var(--error);
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 14px;
    display: none;
  }
  .signin-button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    border: none;
    border-radius: 9px;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s, transform 0.15s;
  }
  .signin-button:hover {
    background: #000000;
    transform: translateY(-1px);
  }
  .register-link {
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    margin-top: 18px;
  }
  .register-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  @media (max-width: 700px) {
    .container {
      grid-template-columns: 1fr;
    }
    .left {
      display: none;
    }
    .right {
      padding: 40px 28px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo">Schedule Sync</div>
    <div class="left-middle">
      <h2>One platform for Students, Faculty and Admins</h2>
      <p>To manage timetables, spot conflicts and stay organised</p>
    </div>
  </div>
  <div class="right">
    <h3>Sign in</h3>
    <p class="sub">Enter your details</p>
    <div class="role-tabs">
      <button class="role-tab active" onclick="setRole('student', this)">Student</button>
      <button class="role-tab" onclick="setRole('faculty', this)">Faculty</button>
      <button class="role-tab" onclick="setRole('admin', this)">Admin</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="aa@gmail.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>
    <button class="signin-button" onclick="handleLogin()">Sign In</button>
    <div class="register-link">
      New here? <a href="register.html">Create an account</a>
    </div>
  </div>
</div>

<script>
  let currentRole = 'student';
  function setRole(role, el) {
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }
  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const err = document.getElementById('errorMsg');
    if (!email || !password) {
      err.textContent = 'Please fill in all fields.';
      err.style.display = 'block';
      return;
    }
    try {
      const res = await fetch('http://localhost:3000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role: currentRole })
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || 'Login failed!';
        err.style.display = 'block';
        return;
      }
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);
      localStorage.setItem('name', data.name);
      const routes = {
        student: 'student/dashboard.html',
        faculty: 'faculty/dashboard.html',
        admin: 'admin/dashboard.html'
      };
      window.location.href = routes[data.role];
    } catch (e) {
      err.textContent = 'Server not reachable. Is Node.js running?';
      err.style.display = 'block';
    }
  }

</script>
</body>
</html>
